# /etc/khs/khs.toml — copy, then adjust paths, hosts and thresholds.
# Validate with: khs config-check --config /etc/khs/khs.toml

state_dir = "/var/lib/khs"

[backup]
# A disk that is NOT the one being backed up (for example a USB drive mounted by fstab).
repository = "/mnt/backup/khs"
sources = ["/srv", "/etc", "/home"]
exclude = ["*.tmp", ".cache", "node_modules", "lost+found"]

[backup.retention]
keep_last = 3
keep_daily = 7
keep_weekly = 4
keep_monthly = 12
keep_yearly = 2

# Notifications are sent only when a check changes state.
# ntfy (self-hosted or ntfy.sh) shows them on your phone; "json" posts {title, message, urgent}.
[notify]
url = "https://ntfy.sh/replace-with-a-long-random-topic"
format = "ntfy"
# token_file = "/etc/khs/ntfy-token"   # Bearer token for a protected topic, file mode 0600

[[check]]
name = "Reverse proxy"
type = "http"
url = "https://home.arpa/"
expect = 200
insecure = true   # Caddy's internal CA; install its root on this host and remove this line

[[check]]
name = "Files (Syncthing GUI)"
type = "tcp"
host = "127.0.0.1"
port = 8384

[[check]]
name = "Root disk"
type = "disk"
path = "/"
max_used_pct = 85

[[check]]
name = "Backup disk"
type = "disk"
path = "/mnt/backup"
max_used_pct = 90

[[check]]
name = "Docker"
type = "systemd"
unit = "docker.service"

[[check]]
name = "Last backup"
type = "backup_age"
max_hours = 26

[[check]]
name = "CPU temperature"
type = "temperature"
max_c = 75

[[check]]
name = "Memory"
type = "memory"
max_used_pct = 92
